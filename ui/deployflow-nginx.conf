upstream argocd {
    server argocd-server.argocd.svc.cluster.local:80;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths load index.html and the router takes over.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # No UI extensions are installed. The page still requests this file.
    location = /extensions.js {
        default_type application/javascript;
        return 200 "";
    }

    # API calls go to the unmodified Argo CD server on the same origin, so the
    # browser needs no CORS and the session cookie works as designed.
    location /api/ {
        proxy_pass http://argocd;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Live updates use Server-Sent Events, which must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
